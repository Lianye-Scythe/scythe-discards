name: Bug report / 問題回報
description: Report unexpected behavior or a reproducible problem.
body:
  - type: input
    id: environment
    attributes:
      label: Versions and environment / 版本與環境
      description: Extension version, Chrome version and operating system.
      placeholder: Scythe Discards 0.3.5 / Chrome version / Windows, Linux or macOS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 重現步驟
      description: Include mode, timeout, protections and other settings relevant to the problem.
      placeholder: Use an example hostname if the specific website is not needed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 預期與實際結果
      description: Screenshots or a short recording can help explain a UI problem.
    validations:
      required: true
