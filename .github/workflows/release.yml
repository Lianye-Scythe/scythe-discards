name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag, for example v0.3.3
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Check tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import pkg from './package.json' with { type: 'json' };
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== 'v' + pkg.version) {
            throw new Error('Tag must match package.version and use vMAJOR.MINOR.PATCH');
          }
          NODE
      - run: npm run package
      - name: Verify package checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$release_is_draft" = "false" ]; then
              echo "Release $RELEASE_TAG is already public; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Scythe Discards $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/scythe-discards-*.zip artifacts/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --verify-tag --title "Scythe Discards $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
