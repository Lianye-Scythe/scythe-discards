name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Check tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import pkg from './package.json' with {type:'json'}; if(process.env.RELEASE_TAG !== 'v'+pkg.version) process.exit(1)"
      - run: npm run package
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/scythe-discards-*.zip artifacts/SHA256SUMS --draft --verify-tag --title "Scythe Discards $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
